<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Compound Interest</title>
	<base href="/">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" type="image/svg+xml" href="svg/ico/favicon.svg">
</head>
<body>
	<app-root>
		<style>
			.app-loading {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				height: 100vh;
				background: #0f172a;
				color: #f1f5f9;
				font-family: system-ui, -apple-system, sans-serif;
			}
			.spinner {
				width: 48px;
				height: 48px;
				border: 4px solid rgba(255, 255, 255, 0.1);
				border-top-color: #3b82f6;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-bottom: 1.5rem;
			}
			@keyframes spin {
				to { transform: rotate(360deg); }
			}
			.loading-text {
				font-size: 1.125rem;
				font-weight: 500;
				letter-spacing: 0.025em;
			}
		</style>
		<div class="app-loading">
			<div class="spinner"></div>
			<div class="loading-text">Nigerian Financial Calculator...</div>
		</div>
	</app-root>
</body>
</html>
