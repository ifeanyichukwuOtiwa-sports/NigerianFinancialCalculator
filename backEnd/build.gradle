plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'jacoco'
    alias(libs.plugins.sonarqube)
}

group = 'iwo.wintech'
version = '0.0.1-SNAPSHOT'
description = 'backEnd'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.data.redis
    implementation libs.spring.session.data.redis
    implementation libs.spring.boot.starter.jdbc
    implementation libs.spring.boot.autoconfigure
    implementation libs.spring.boot.starter.security
    implementation libs.spring.boot.starter.liquibase
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.restclient
    implementation libs.jackson.databind
    implementation libs.spring.boot.starter.validation
    implementation libs.itextpdf
    implementation libs.bucket4j.core
    compileOnly libs.lombok
    runtimeOnly libs.mysql.connector.j
    annotationProcessor libs.lombok
    testImplementation libs.spring.boot.starter.test
    testImplementation libs.spring.boot.test.autoconfigure
    testImplementation libs.spring.boot.webmvc.test
    testImplementation libs.spring.boot.resttestclient
    testImplementation libs.spring.boot.testcontainers
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.mysql
    testImplementation libs.jsonassert
    testCompileOnly libs.lombok
    testRuntimeOnly libs.junit.platform.launcher
    testAnnotationProcessor libs.lombok
}

if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
    dependencies {
        runtimeOnly libs.netty.resolver.dns.native.macos
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs += '--enable-native-access=ALL-UNNAMED'
}

// ── Docker Image via Spring Boot Buildpacks (Cloud Native Buildpacks / Paketo) ──
// Usage: ./gradlew bootBuildImage
// This replaces the need for a manual Dockerfile for the backend.
// Produces an OCI image with optimized layers, non-root user, and auto memory tuning.
tasks.named('bootBuildImage') {
    imageName = "ngn-calc-backend:${project.version}"
    environment = [
        'BP_JVM_VERSION': '25',
        'BPL_JVM_FLAGS': '--enable-native-access=ALL-UNNAMED'
    ]
    tags = ["ngn-calc-backend:latest"]
}

jacoco {
    toolVersion = "0.8.14"
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "ifeanyichukwuOtiwa-sports_NigerianFinancialCalculator_backend"
        property "sonar.organization", "ifeanyichukwuotiwa-sports"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.java.coveragePlugin", "jacoco"
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get().asFile}/reports/jacoco/test/jacocoTestReport.xml"
    }
}
