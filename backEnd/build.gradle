plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'iwo.wintech'
version = '0.0.1-SNAPSHOT'
description = 'backEnd'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.itextpdf:itextpdf:5.5.13.5'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.skyscreamer:jsonassert:1.5.3'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
    dependencies {
        runtimeOnly 'io.netty:netty-resolver-dns-native-macos'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs += '--enable-native-access=ALL-UNNAMED'
}

// ── Docker Image via Spring Boot Buildpacks (Cloud Native Buildpacks / Paketo) ──
// Usage: ./gradlew bootBuildImage
// This replaces the need for a manual Dockerfile for the backend.
// Produces an OCI image with optimized layers, non-root user, and auto memory tuning.
tasks.named('bootBuildImage') {
    imageName = "ngn-calc-backend:${project.version}"
    environment = [
        'BP_JVM_VERSION': '25',
        'BPL_JVM_FLAGS': '--enable-native-access=ALL-UNNAMED'
    ]
    tags = ["ngn-calc-backend:latest"]
}

jacoco {
    toolVersion = "0.8.14"
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "ifeanyichukwuOtiwa-sports_NigerianFinancialCalculator_backend"
        property "sonar.organization", "ifeanyichukwuotiwa-sports"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.java.coveragePlugin", "jacoco"
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get().asFile}/reports/jacoco/test/jacocoTestReport.xml"
    }
}
