version: 2
updates:
  # ── Backend: Gradle ──────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/backEnd"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 10
    labels: ["dependencies", "backend", "security"]
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    # Stay on stable/LTS majors: only auto-bump minor + patch. Major upgrades
    # (e.g. Spring Boot 5) are done deliberately, not via Dependabot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Single grouped PR for all backend dependency updates.
      backend:
        applies-to: version-updates
        patterns: ["*"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── Frontend: npm ────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontEnd"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 10
    labels: ["dependencies", "frontend", "security"]
    versioning-strategy: "increase"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    # Stay on stable/LTS majors: only auto-bump minor + patch. Major upgrades
    # (Angular, ESLint, TypeScript) are done deliberately via `ng update`.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Single grouped PR for all frontend dependency updates.
      frontend:
        applies-to: version-updates
        patterns: ["*"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── CI: GitHub Actions ───────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
