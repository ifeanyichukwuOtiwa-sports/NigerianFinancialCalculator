name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths: ['frontEnd/**']
  pull_request:
    branches: [develop, main]
    paths: ['frontEnd/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontEnd/package-lock.json

      - name: Install dependencies
        working-directory: frontEnd
        run: npm ci

      - name: Lint
        working-directory: frontEnd
        run: npx ng lint

      - name: Build
        working-directory: frontEnd
        run: npx ng build
