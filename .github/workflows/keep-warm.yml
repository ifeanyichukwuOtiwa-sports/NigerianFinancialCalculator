name: Keep Warm

# Prevents Railway cold starts: pings the backend health endpoint on a schedule
# so the container never idles down and nginx never 504s a cold request.
#
# Setup: set a repository variable BACKEND_URL to the backend base URL
#   (Settings -> Secrets and variables -> Actions -> Variables),
#   e.g. https://backend.up.railway.app  (no trailing slash).

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Cron is best-effort and may drift under load.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Never run two pings at once; a slow cold start shouldn't stack.
concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Repository variable BACKEND_URL is not set."
            exit 1
          fi
          # --max-time is generous so a cold start counts as a successful warm-up, not a failure.
          # --retry rides out the boot window (JVM + Liquibase + DB/Redis connect).
          curl -fsS \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 90 \
            "${BACKEND_URL%/}/actuator/health"
          echo "Backend is warm."
